<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JNV Lawan Landslide Monitoring</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .heading {
            font-size: 2.5em;
            color: #007BFF;
            margin-bottom: 20px;
            animation: fadeIn 2s ease-in-out;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-color: #fff;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            animation: slideDown 1s ease-in-out;
            max-width: 600px;
            width: 100%;
            position: relative;
        }

        .data-panel, .status-panel {
            background-color: #f9f9f9;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            width: 100%;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
            animation: popUp 1.5s ease-in-out;
        }

        .data-panel {
            background-color: #e7f3fe;
        }

        .status-panel {
            background-color: #ffe7e7;
        }

        .data {
            font-size: 1.2em;
            margin: 5px 0;
            transition: color 0.5s ease;
        }

        .update-time {
            font-size: 0.9em;
            color: #666;
            margin-top: 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideDown {
            from { transform: translateY(-100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes popUp {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Mountain Animation */
        .mountains {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 200px;
            background: url('https://www.svgrepo.com/show/398565/mountains.svg') repeat-x;
            background-size: cover;
            animation: moveMountains 10s linear infinite;
            opacity: 0.2;
        }

        @keyframes moveMountains {
            from { background-position: 0 0; }
            to { background-position: 1000px 0; }
        }

        .danger-mode {
            background-color: #FF0000;
            color: #fff;
            transition: background-color 1s ease;
        }

        .danger-mode .status-panel {
            background-color: #ffcccc;
        }

        .danger-mode .heading {
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="mountains"></div>
    <div class="container">
        <h1 class="heading">Landslide Monitoring System</h1>

        <div class="data-panel">
            <div id="moisture" class="data">Soil Moisture: --</div>
            <div id="rain" class="data">Rain: --</div>
            <div id="angle" class="data">Angle of Surface: --</div>
        </div>

        <div class="status-panel">
            <div id="landSchance" class="data">Probability of Landslide: --</div>
            <div id="slopeStatus" class="data">Status of Land Slope: --</div>
        </div>

        <div class="update-time" id="update-time">Last Updated: --</div>
    </div>

    <script>
        function fetchData() {
            fetch('/data')
                .then(response => response.json())
                .then(data => {
                    const container = document.querySelector('.container');
                    if (data.lsc == 0) {
                        data.lsc = "Nearly No Chance";
                        container.classList.remove('danger-mode');
                    } else if (data.lsc == 1) {
                        data.lsc = "Low Chance";
                    } else if (data.lsc == 2) {
                        data.lsc = "Moderate Chance";
                        container.classList.add('danger-mode');
                    } else if (data.lsc == 3) {
                        data.lsc = "High Chance";
                        container.classList.add('danger-mode');
                    }

                    if (data.sS == 0) {
                        data.sS = "No Landslide";
                    } else if (data.sS == 1) {
                        data.sS = "Unusual Land Movement";
                    } else if (data.sS == 2) {
                        data.sS = "Landslide";
                        container.classList.add('danger-mode');
                    }

                    document.getElementById('moisture').textContent = `Soil Moisture: ${data.moistData}%`;
                    document.getElementById('rain').textContent = `Rain: ${data.rainData}%`;
                    document.getElementById('angle').textContent = `Angle of Surface: ${data.angleXAxis}°`;
                    document.getElementById('landSchance').textContent = `Probability of Landslide: ${data.lsc}`;
                    document.getElementById('slopeStatus').textContent = `Status of Land Slope: ${data.sS}`;

                    const now = new Date();
                    document.getElementById('update-time').textContent = `Last Updated: ${now.toLocaleTimeString()}`;
                })
                .catch(error => console.error('Error fetching data:', error));
        }

        fetchData();
        setInterval(fetchData, 10000);
    </script>
</body>
</html>
